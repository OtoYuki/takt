[package]
name = "takt"
version = "0.1.0"
edition = "2021"
description = "SOTA micrographic Wayland desktop telemetry deck in Rust"

[dependencies]
relm4 = "0.9"
gtk4 = "0.9"
gtk4-layer-shell = "0.4"
sysinfo = "0.33"
chrono = "0.4"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
