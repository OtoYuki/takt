<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Silicon IC Package Chassis (0px corners) -->
  <rect x="3.5" y="3.5" width="9" height="9" fill="#172213" stroke="#D1CF8B" stroke-width="1.25"/>
  <!-- Central Compute Die -->
  <rect x="6" y="6" width="4" height="4" fill="#999208"/>
  <!-- Pin 1 Dot Index -->
  <circle cx="4.75" cy="4.75" r="0.6" fill="#D8A664"/>
  <!-- Top Pins -->
  <line x1="5.5" y1="1" x2="5.5" y2="3.5" stroke="#999208" stroke-width="1.2"/>
  <line x1="8" y1="1" x2="8" y2="3.5" stroke="#999208" stroke-width="1.2"/>
  <line x1="10.5" y1="1" x2="10.5" y2="3.5" stroke="#999208" stroke-width="1.2"/>
  <!-- Bottom Pins -->
  <line x1="5.5" y1="12.5" x2="5.5" y2="15" stroke="#999208" stroke-width="1.2"/>
  <line x1="8" y1="12.5" x2="8" y2="15" stroke="#999208" stroke-width="1.2"/>
  <line x1="10.5" y1="12.5" x2="10.5" y2="15" stroke="#999208" stroke-width="1.2"/>
  <!-- Left Pins -->
  <line x1="1" y1="5.5" x2="3.5" y2="5.5" stroke="#999208" stroke-width="1.2"/>
  <line x1="1" y1="8" x2="3.5" y2="8" stroke="#999208" stroke-width="1.2"/>
  <line x1="1" y1="10.5" x2="3.5" y2="10.5" stroke="#999208" stroke-width="1.2"/>
  <!-- Right Pins -->
  <line x1="12.5" y1="5.5" x2="15" y2="5.5" stroke="#999208" stroke-width="1.2"/>
  <line x1="12.5" y1="8" x2="15" y2="8" stroke="#999208" stroke-width="1.2"/>
  <line x1="12.5" y1="10.5" x2="15" y2="10.5" stroke="#999208" stroke-width="1.2"/>
</svg>
