<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Bold Cassette Housing -->
  <rect x="0.75" y="2.5" width="14.5" height="11" rx="1.5" fill="#1c2517" stroke="#D1CF8B" stroke-width="1.5"/>
  <!-- Inner Label Window -->
  <rect x="3" y="5" width="10" height="6" rx="0.5" fill="none" stroke="#5A6042" stroke-width="1"/>
  <!-- Left Spool Reel -->
  <circle cx="5.25" cy="8" r="1.8" fill="#D8A664"/>
  <circle cx="5.25" cy="8" r="0.7" fill="#141C10"/>
  <!-- Right Spool Reel -->
  <circle cx="10.75" cy="8" r="1.8" fill="#D8A664"/>
  <circle cx="10.75" cy="8" r="0.7" fill="#141C10"/>
  <!-- Magnetic Tape Bridge -->
  <line x1="5.25" y1="8" x2="10.75" y2="8" stroke="#999208" stroke-width="1.2"/>
</svg>
