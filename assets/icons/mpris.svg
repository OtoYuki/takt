<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14" width="14" height="14">
  <!-- Cassette Housing -->
  <rect x="0.5" y="2" width="13" height="10" fill="#172213" stroke="#D1CF8B" stroke-width="1"/>
  <!-- Tape Window -->
  <rect x="2.5" y="4.5" width="9" height="5" fill="#141C10" stroke="#5A6042" stroke-width="0.8"/>
  <!-- Left Spool -->
  <circle cx="4.5" cy="7" r="1.5" fill="#D8A664"/>
  <circle cx="4.5" cy="7" r="0.6" fill="#141C10"/>
  <!-- Right Spool -->
  <circle cx="9.5" cy="7" r="1.5" fill="#D8A664"/>
  <circle cx="9.5" cy="7" r="0.6" fill="#141C10"/>
  <!-- Tape Bridge -->
  <line x1="4.5" y1="7" x2="9.5" y2="7" stroke="#999208" stroke-width="1"/>
</svg>
